image boot.vfat {
    vfat {
        files = {
            "zImage",
            "sun7i-a20-olinuxino-lime2.dtb",
            "boot.scr"
        }
    }
    size = 32M
}

# 2. Define the Final SD Card Layout
image sdcard.img {
    hdimage {
    }

    # Partition 1: U-Boot SPL (Sunxi boards need U-Boot flashed at a raw offset)
    partition u-boot {
        in-partition-table = "no"
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
    }

    # Partition 2: The Boot Partition (FAT) containing kernels and custom files
    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    # Partition 3: The Root Filesystem (EXT4)
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 512M # Or leave empty to auto-grow to the size of rootfs.ext4
    }
}
